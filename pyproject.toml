[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthjev"
version = "1.0.0"
description = "EarthJev: efficient visual evidence acquisition and decision for UHR remote sensing understanding"
license = "Apache-2.0"
authors = [{ name = "EarthJev Authors" }]
requires-python = "==3.12.*"
# The exact environment is pinned in requirements/cpu.txt and requirements/gpu.txt (docs/INSTALL.md).
dependencies = []

[tool.setuptools.packages.find]
include = ["earthjev", "earthjev.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "data: needs the benchmark images under $EARTHJEV_DATA (or, for the ZwZ test, the built training manifest)",
    "model: needs the tokenizer and processor files of the answering models under $EARTHJEV_MODELS (not their weights)",
]
